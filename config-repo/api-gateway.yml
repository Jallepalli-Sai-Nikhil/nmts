server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service (Public)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        # User Service (Authenticated)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
          filters:
            - JwtAuthenticationGatewayFilter

        # Mining Agency Service (Authenticated)
        - id: mining-agency-service
          uri: lb://mining-agency-service
          predicates:
            - Path=/agencies/**, /listings/**, /purchases/**
          filters:
            - JwtAuthenticationGatewayFilter

        # License Service (Authenticated)
        - id: license-service
          uri: lb://license-service
          predicates:
            - Path=/licenses/**
          filters:
            - JwtAuthenticationGatewayFilter

        # Search Catalog Service (Authenticated)
        - id: search-catalog-service
          uri: lb://search-catalog-service
          predicates:
            - Path=/search/**
          filters:
            - JwtAuthenticationGatewayFilter

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: user-service
        url: /users/v3/api-docs
      - name: mining-agency-service
        url: /agencies/v3/api-docs
      - name: license-service
        url: /licenses/v3/api-docs
    config-url: /v3/api-docs/swagger-config
  api-docs:
    enabled: true

eureka:
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

